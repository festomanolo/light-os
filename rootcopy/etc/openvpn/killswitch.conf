# /etc/openvpn/killswitch.conf — Light OS Pre-Wi-Fi OpenVPN Kill Switch settings
#
# KILLSWITCH_ENABLED=1
#   1 = Lock down non-VPN internet traffic at boot and before Wi-Fi connects (default).
#   0 = Disable automatic firewall kill switch at boot.
KILLSWITCH_ENABLED=1

# AUTO_CONNECT_ON_WIFI=1
#   1 = Automatically launch OpenVPN when Wi-Fi or Ethernet comes up.
AUTO_CONNECT_ON_WIFI=1

# ALLOW_LAN=0
#   0 = Strict kill switch: block RFC1918 local LAN traffic except DHCP (UDP 67:68).
#   1 = Allow RFC1918 local LAN subnets (10/8, 172.16/12, 192.168/16) while blocking internet.
ALLOW_LAN=0

# STRICT_VPN_DNS=1
#   1 = Only allow DNS queries inside the encrypted VPN tunnel (tun+/tap+) or loopback.
STRICT_VPN_DNS=1
